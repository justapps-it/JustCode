name: Build & Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: CLI starts
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
      - name: Install the packed package globally and run it
        shell: bash
        run: |
          npm pack
          npm install -g ./justapps-just-code-*.tgz
          just-code --version
          jc --version

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.state.outputs.gh }}
      tag: ${{ steps.state.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: npm >= 11.5 (required for Trusted Publishing)
        run: npm install -g npm@latest && npm -v
      - name: Pack
        run: |
          npm pack
          mkdir -p out
          mv justapps-just-code-*.tgz out/
          cp out/justapps-just-code-*.tgz out/just-code.tgz
          ls -la out

      - name: What is already published?
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "npm=false" >> "$GITHUB_OUTPUT"; else echo "npm=true" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "gh=false" >> "$GITHUB_OUTPUT"; else echo "gh=true" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to npm (Trusted Publishing, no token)
        if: steps.state.outputs.npm == 'true'
        run: |
          # If another run published the same version meanwhile, that is fine.
          npm publish ./out/just-code.tgz --access public || {
            sleep 20
            npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version
          }

      - name: Publish GitHub release
        if: steps.state.outputs.gh == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.state.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: just-Code ${{ steps.state.outputs.tag }}
          make_latest: true
          files: out/*.tgz
          generate_release_notes: true
          body: |
            ## Installazione (macOS, Linux, Windows · Node.js 20+)
            ```
            npm install -g @justapps/just-code
            ```
            oppure `curl -fsSL https://code.justapps.it/install.sh | sh` (macOS/Linux) · `irm https://code.justapps.it/install.ps1 | iex` (Windows)

            ## App desktop
            Scarica il file per il tuo sistema qui sotto (compare qualche minuto dopo la release):
            - **macOS** Apple Silicon: `just-Code-*-mac-arm64.dmg` · Intel: `just-Code-*-mac-x64.dmg`
            - **Windows**: `just-Code-*-win-x64.exe`
            - **Linux**: `just-Code-*-linux-x86_64.AppImage`

            L'app non è firmata da Apple/Microsoft: su macOS, dopo il primo tentativo di apertura, vai in *Impostazioni di Sistema → Privacy e sicurezza → Apri comunque*; su Windows clicca *Ulteriori informazioni → Esegui comunque*.

  desktop:
    name: desktop (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - name: Build installers
        run: npm run dist
        working-directory: desktop
      - name: Attach to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          TAG=v$(node -p "require('./package.json').version")
          files=(desktop/release/*.dmg desktop/release/*.exe desktop/release/*.AppImage)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
